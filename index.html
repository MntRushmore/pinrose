<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Pinrose</title>
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #c9c9a5;
        font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      h1 {
        position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
        margin: 0; font-weight: 400; letter-spacing: 0.42em;
        font-size: 13px; color: #3a3828;
      }
      #hint {
        position: absolute; top: 36px; left: 50%; transform: translateX(-50%);
        margin: 0; font-size: 11px; letter-spacing: 0.22em; color: #3a3828;
        opacity: 0.65;
      }
      #hint.hide { display: none; }
      #overlay.miss #replay { display: none; }
      .controls {
        position: absolute; bottom: 20px; left: 0; right: 0;
        display: flex; justify-content: center; align-items: center; gap: 28px;
        pointer-events: auto;
      }
      button {
        appearance: none; background: none; border: 0; padding: 10px 8px;
        color: #3a3828; font-size: 18px; font-weight: 300; letter-spacing: 0.18em;
        cursor: pointer; pointer-events: auto; line-height: 1;
        min-width: 44px; min-height: 44px;
      }
      button.small { font-size: 11px; letter-spacing: 0.28em; }
      #overlay {
        display: none; position: absolute; inset: 0;
        align-items: center; justify-content: center;
        flex-direction: column; pointer-events: auto;
      }
      #overlay.show { display: flex; }
      #overlay h2 {
        font-size: 42px; margin: 0 0 12px; color: #3a3828;
        font-weight: 400; letter-spacing: 0.36em;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <h1>PINROSE</h1>
      <p id="hint">drag to steer</p>
      <div class="controls">
        <button id="tipdown" type="button" aria-label="tip down">&#9660;</button>
        <button id="left" type="button" aria-label="rotate left">&#9664;</button>
        <button id="reset" class="small" type="button">RESET</button>
        <button id="right" type="button" aria-label="rotate right">&#9654;</button>
        <button id="tipup" type="button" aria-label="tip up">&#9650;</button>
      </div>
      <div id="overlay">
        <h2>PIN</h2>
        <button id="replay" class="small" type="button">REPLAY</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
