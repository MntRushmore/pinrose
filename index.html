<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Pinrose</title>
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #c9c9a5;
        font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      #ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      #brand {
        position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
        margin: 0; font-weight: 500; letter-spacing: 0.48em;
        font-size: 11px; color: #3a3828; opacity: 0.55;
      }
      #score {
        position: absolute; top: 42px; left: 50%; transform: translateX(-50%);
        margin: 0; font-weight: 600; letter-spacing: -0.04em;
        font-size: 72px; color: #2e2c20; line-height: 1;
      }
      #hint {
        position: absolute; top: 128px; left: 50%; transform: translateX(-50%);
        margin: 0; font-size: 13px; letter-spacing: 0.18em; color: #3a3828;
        opacity: 0.55; white-space: nowrap;
      }
      #hint.hide { opacity: 0; }
      #overlay {
        display: none; position: absolute; inset: 0;
        align-items: center; justify-content: center;
        flex-direction: column; pointer-events: auto;
        background: rgba(201, 201, 165, 0.72);
      }
      #overlay.show { display: flex; }
      #overlay h2 {
        font-size: 28px; margin: 0 0 8px; color: #2e2c20;
        font-weight: 500; letter-spacing: 0.08em; text-align: center;
        max-width: 80vw;
      }
      #over-score {
        font-size: 84px; font-weight: 600; letter-spacing: -0.04em;
        color: #2e2c20; line-height: 1; margin: 4px 0 6px;
      }
      #over-best {
        font-size: 14px; letter-spacing: 0.22em; color: #3a3828;
        opacity: 0.6; margin-bottom: 28px;
      }
      #replay {
        appearance: none; background: #2e2c20; color: #f3f0d8;
        border: 0; padding: 14px 28px; border-radius: 999px;
        font-size: 13px; letter-spacing: 0.28em; cursor: pointer;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <p id="brand">PINROSE</p>
      <p id="score">0</p>
      <p id="hint">spin the 7</p>
      <div id="overlay">
        <h2 id="roast">MISS</h2>
        <div id="over-score">0</div>
        <div id="over-best">best 0</div>
        <button id="replay" type="button">PLAY AGAIN</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
